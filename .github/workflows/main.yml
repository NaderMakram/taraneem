name: Create Release on Tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag pushed: $TAG"

          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a three-part numeric version (for example, 3.9.0)."
            exit 1
          fi

  build-windows:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set package version from tag
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Test release configuration
        run: npm test

      - name: Write analytics config for build
        shell: bash
        run: |
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            node -e "
              const fs = require('fs');
              fs.writeFileSync('src/config/analytics.bundled.json', JSON.stringify({
                supabaseUrl: process.env.SUPABASE_URL,
                supabaseAnonKey: process.env.SUPABASE_ANON_KEY
              }, null, 2) + '\n');
            "
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build Windows installer
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Windows installer and update feed
        run: >-
          node scripts/verify-release-artifacts.js
          --platform windows
          --version "${{ github.ref_name }}"
          --dir "release/${{ github.ref_name }}"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            release/${{ github.ref_name }}/Taraneem-Windows-${{ github.ref_name }}-Setup.exe
            release/${{ github.ref_name }}/Taraneem-Windows-${{ github.ref_name }}-Setup.exe.blockmap
            release/${{ github.ref_name }}/latest.yml

  build-macos:
    needs: validate-tag
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Set package version from tag
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Test release configuration
        run: npm test

      - name: Write analytics config for build
        shell: bash
        run: |
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            node -e "
              const fs = require('fs');
              fs.writeFileSync('src/config/analytics.bundled.json', JSON.stringify({
                supabaseUrl: process.env.SUPABASE_URL,
                supabaseAnonKey: process.env.SUPABASE_ANON_KEY
              }, null, 2) + '\n');
            "
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build unsigned universal macOS DMG
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS app architectures and unsigned release mode
        shell: bash
        run: |
          APP_PATH="release/${GITHUB_REF_NAME}/mac-universal/Taraneem.app"
          test -d "$APP_PATH"

          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/Taraneem")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *"x86_64"* ]]
          [[ "$ARCHS" == *"arm64"* ]]

          SIGNATURE_DETAILS="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1 || true)"
          if grep -q "Authority=Developer ID Application" <<< "$SIGNATURE_DETAILS"; then
            echo "Unexpected paid Developer ID signature in the unsigned build"
            exit 1
          fi

      - name: Verify macOS manual installer
        run: >-
          node scripts/verify-release-artifacts.js
          --platform macos
          --version "${{ github.ref_name }}"
          --dir "release/${{ github.ref_name }}"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-assets
          if-no-files-found: error
          retention-days: 1
          path: release/${{ github.ref_name }}/Taraneem-macOS-${{ github.ref_name }}-universal.dmg

  publish-windows:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Re-verify Windows update feed
        run: >-
          node scripts/verify-release-artifacts.js
          --platform windows
          --version "${{ github.ref_name }}"
          --dir release-assets

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*

  publish-macos:
    needs: [build-macos, publish-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-release-assets
          path: release-assets

      - name: Re-verify macOS manual installer
        run: >-
          node scripts/verify-release-artifacts.js
          --platform macos
          --version "${{ github.ref_name }}"
          --dir release-assets

      - name: Attach macOS DMG to the existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: release-assets/*